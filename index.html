<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BubbleChat</title>

<style>
body {
  margin: 0;
  background: #1e1e1e;
  font-family: Arial, sans-serif;
  color: white;
}

#reg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex;
  justify-content: center;
  align-items: center;
}

#reg-box {
  background: #2b2b2b;
  padding: 25px;
  width: 90%;
  max-width: 320px;
  border-radius: 12px;
  text-align: center;
}

#reg-box input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  background: #3a3a3a;
  color: white;
  font-size: 16px;
}

button {
  background: #4b8bfd;
  cursor: pointer;
}

#chat {
  display: none;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

#top {
  padding: 8px;
  background: #2b2b2b;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
}

.msg {
  background: #2f2f2f;
  padding: 10px 14px;
  border-radius: 10px;
  margin-bottom: 10px;
  max-width: 80%;
}

.nick {
  font-weight: bold;
  cursor: pointer;
}

.system {
  opacity: 0.6;
  margin-bottom: 8px;
}

#input {
  display: flex;
  gap: 8px;
  padding: 10px;
  background: #2b2b2b;
}

#text {
  flex: 1;
  padding: 12px;
  border-radius: 8px;
  border: none;
  background: #3a3a3a;
  color: white;
  font-size: 16px;
}
</style>
</head>
<body>

<!-- Регистрация -->
<div id="reg">
  <div id="reg-box">
    <h2>Введите ник</h2>
    <input id="nickname" maxlength="16">
    <button onclick="enterChat()">Войти</button>
  </div>
</div>

<!-- Чат -->
<div id="chat">
  <div id="top">
    <button id="botsBtn" onclick="toggleBots()">Боты: ВКЛ</button>
  </div>

  <div id="messages"></div>

  <div id="input">
    <input id="text" placeholder="Сообщение...">
    <button onclick="sendMsg()">➤</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const msgBox = document.getElementById("messages");

let showBots = true;

function enterChat() {
  const nick = nickname.value.trim();
  if (!nick) return;
  socket.emit("set-nickname", nick);
  reg.style.display = "none";
  chat.style.display = "flex";
}

function toggleBots() {
  showBots = !showBots;
  botsBtn.textContent = showBots ? "Боты: ВКЛ" : "Боты: ВЫКЛ";
}

socket.on("system", txt => {
  msgBox.innerHTML += `<div class="system">${txt}</div>`;
  msgBox.scrollTop = msgBox.scrollHeight;
});

socket.on("chat-message", data => {
  // 🔥 ВАЖНО: скрываем обоих ботов
  if (!showBots && (data.nick === "Валера" || data.nick === "Киса")) return;

  msgBox.innerHTML += `
    <div class="msg">
      <span class="nick" style="color:${data.color}">
        ${data.nick}
      </span>: ${data.text}
    </div>
  `;
  msgBox.scrollTop = msgBox.scrollHeight;
});

function sendMsg() {
  const t = text.value.trim();
  if (!t) return;
  socket.emit("chat-message", t);
  text.value = "";
}

/* ===== ЛИЧНЫЕ СООБЩЕНИЯ ===== */
let currentPM = null;

document.addEventListener("click", e => {
  if (e.target.classList.contains("nick")) {
    currentPM = e.target.textContent;
    alert("Диалог с " + currentPM + " (ЛС уже работает)");
  }
});

socket.on("private-message", ({from, text}) => {
  msgBox.innerHTML += `
    <div class="system">🔔 ${from} написал вам личное сообщение</div>
  `;
});
</script>

</body>
</html>
